<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Pursuit</title>
    <link rel="stylesheet" href="style.css">
    <script src="./game.js" defer></script>
</head>
<body>

    <header class="game-header">
        <h1>Trivial Pursuit</h1>
    <p>Collect all six categories</p>

    <label for="difficulty">Difficulty:</label>
    <select name="difficulty" id="difficulty">
        <option value="helppo">Easy</option>
        <option value="keskitaso">Normal</option>
        <option value="vaikea">Hard</option>
    </select>
    </header>
    
    <section class="status-panel">
        <article class="player-card">
            <h2>Player</h2>
            <img src="./graphics/player.png" class="player-image">
            <p>Kerätyt aihealueet: 0/6</p>

            <section class="question-panel">
            <h2>Category:</h2>
            <p id="category-text">Roll the dice!</p>
            <h2>Question:</h2>
            <p id="question-text">Roll the dice!</p>
            </section>
        </article>

        <section class="turn-panel">
                <p>Vuorossa</p>
                <h2>Pelaaja</h2>
                <div id="dice" class="dice">Roll</div>
                <div id="board" class="board"></div>
            </section>

            <article class="player-card">
                <h2>Tekoäly</h2>
                <p>Kerätyt aihealueet: 0/6</p>
            </article>
    </section>

</body>
</html>
